name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed tag
        uses: actions/checkout@v4
        with:
          # The tagged commit, not main's HEAD, so the gate below reads the version the tag names.
          ref: ${{ github.ref }}
          # Whole history and tags, for the commit list since the previous tag.
          fetch-depth: 0

      - name: Verify plugin.json version against tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vX.Y.Z, got: $TAG"
            exit 1
          fi
          actual="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$actual" != "${TAG#v}" ]; then
            echo ".claude-plugin/plugin.json version is $actual, tag is $TAG"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Body = the committed update note, then the commits since the previous tag (all of them for
          # the first), version bumps left out. glance pushes to main without pull requests, so GitHub's
          # generated notes, which list merged pull requests, would be empty.
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            cat .github/release-notes-template.md
            echo
            echo "## Changes"
            echo
            git log --no-merges --invert-grep --grep="^chore: 버전 v" --format="- %s (%h)" "${prev:+$prev..}$TAG"
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
            fi
          } > release-body.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-body.md
